name: Publish markdown tarballs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Zephyr target to build
        required: true
        default: all
        type: choice
        options:
          - all
          - beriberikix-zephyr-docs-llms-txt
          - zephyrproject-rtos-zephyr-main
          - zephyrproject-rtos-zephyr-v4-4-0

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    name: ${{ matrix.repo_slug }} @ ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: https://github.com/beriberikix/zephyr
            ref: docs/llms-txt
            repo_slug: beriberikix-zephyr
            ref_slug: docs-llms-txt
            target_slug: beriberikix-zephyr-docs-llms-txt
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: main
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: main
            target_slug: zephyrproject-rtos-zephyr-main
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: v4.4.0
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: v4-4-0
            target_slug: zephyrproject-rtos-zephyr-v4-4-0
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}/.cache/west/${{ matrix.repo_slug }}/${{ matrix.ref_slug }}
      OUTPUT_DIR: ${{ github.workspace }}/out/${{ matrix.repo_slug }}-${{ matrix.ref_slug }}
      ARCHIVE_NAME: ${{ matrix.repo_slug }}-${{ matrix.ref_slug }}-markdown.tar.gz

    steps:
      - name: Check out zdocs
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          python -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "${GITHUB_ENV}"

      - name: Cache Zephyr workspace
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKSPACE_ROOT }}
          key: ${{ runner.os }}-west-zdocs-${{ hashFiles('scripts/build-markdown.sh', 'scripts/setup-zephyr-workspace.sh', '.github/workflows/publish-markdown-tarballs.yml') }}-${{ matrix.repo_slug }}-${{ matrix.ref_slug }}
          restore-keys: |
            ${{ runner.os }}-west-zdocs-${{ hashFiles('scripts/build-markdown.sh', 'scripts/setup-zephyr-workspace.sh', '.github/workflows/publish-markdown-tarballs.yml') }}-${{ matrix.repo_slug }}-

      - name: Install host dependencies
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            doxygen \
            graphviz \
            librsvg2-bin \
            imagemagick

      - name: Install Python tooling
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: python -m pip install --upgrade pip wheel "west>=1,<2"

      - name: Prepare Zephyr workspace
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          scripts/setup-zephyr-workspace.sh \
            --workspace-root "${WORKSPACE_ROOT}" \
            --zephyr-repo "${{ matrix.repo }}" \
            --zephyr-ref "${{ matrix.ref }}" \
            --mode filtered \
            --group-filter "-babblesim,-optional,-testing"

      - name: Hash Zephyr doc requirements
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        id: requirements-hash
        run: |
          requirements_hash="$(sha256sum "${WORKSPACE_ROOT}/zephyr/doc/requirements.txt" | awk '{print $1}')"
          echo "value=${requirements_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore Python package cache
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        id: restore-python-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-zdocs-${{ matrix.target_slug }}-${{ steps.requirements-hash.outputs.value }}
          restore-keys: |
            ${{ runner.os }}-pip-zdocs-${{ matrix.target_slug }}-

      - name: Log Python environment
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          python --version
          python -m pip --version
          west --version
          {
            echo "## Tooling"
            echo ""
            echo "- target: ${{ matrix.target_slug }}"
            echo "- python: $(python --version 2>&1)"
            echo "- pip: $(python -m pip --version)"
            echo "- west: $(west --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install west package requirements
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          cd "${WORKSPACE_ROOT}"
          west packages pip --install

      - name: Install Zephyr doc requirements
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          cd "${WORKSPACE_ROOT}"
          python -m pip install -r zephyr/doc/requirements.txt

      - name: Install sphinx-llm
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: python -m pip install sphinx-llm

      - name: Log resolved doc tool versions
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          python -m pip show west Sphinx sphinx-llm docutils | sed '/^$/d'

      - name: Save Python package cache
        if: ${{ (inputs.target == 'all' || inputs.target == matrix.target_slug) && steps.restore-python-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-zdocs-${{ matrix.target_slug }}-${{ steps.requirements-hash.outputs.value }}

      - name: Build markdown tarball
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          scripts/build-markdown.sh \
            --zephyr-root "${WORKSPACE_ROOT}/zephyr" \
            --output-dir "${OUTPUT_DIR}" \
            --archive-name "${ARCHIVE_NAME}"

      - name: Record artifact digest
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          checksum="$(sha256sum "${OUTPUT_DIR}/${ARCHIVE_NAME}")"
          {
            echo "## Markdown tarball"
            echo ""
            echo "- source repo: ${{ matrix.repo }}"
            echo "- source ref: ${{ matrix.ref }}"
            echo "- artifact: ${ARCHIVE_NAME}"
            echo "- sha256: ${checksum%% *}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload markdown tarball
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo_slug }}-${{ matrix.ref_slug }}-markdown
          path: ${{ env.OUTPUT_DIR }}/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
