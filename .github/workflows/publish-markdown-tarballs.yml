name: Publish markdown tarballs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Zephyr target to build
        required: true
        default: all
        type: choice
        options:
          - all
          - zephyrproject-rtos-zephyr-main
          - zephyrproject-rtos-zephyr-v3-7-0
          - zephyrproject-rtos-zephyr-v4-0-0
          - zephyrproject-rtos-zephyr-v4-1-0
          - zephyrproject-rtos-zephyr-v4-2-0
          - zephyrproject-rtos-zephyr-v4-3-0
          - zephyrproject-rtos-zephyr-v4-4-0

permissions:
  contents: write

env:
  DT_TURBO_MODE: "1"
  HW_FEATURES_TURBO_MODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    name: ${{ matrix.repo_slug }} @ ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: main
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: main
            target_slug: zephyrproject-rtos-zephyr-main
            version: main
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: v3.7.0
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: v3-7-0
            target_slug: zephyrproject-rtos-zephyr-v3-7-0
            version: v3.7.0
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: v4.0.0
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: v4-0-0
            target_slug: zephyrproject-rtos-zephyr-v4-0-0
            version: v4.0.0
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: v4.1.0
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: v4-1-0
            target_slug: zephyrproject-rtos-zephyr-v4-1-0
            version: v4.1.0
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: v4.2.0
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: v4-2-0
            target_slug: zephyrproject-rtos-zephyr-v4-2-0
            version: v4.2.0
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: v4.3.0
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: v4-3-0
            target_slug: zephyrproject-rtos-zephyr-v4-3-0
            version: v4.3.0
          - repo: https://github.com/zephyrproject-rtos/zephyr
            ref: v4.4.0
            repo_slug: zephyrproject-rtos-zephyr
            ref_slug: v4-4-0
            target_slug: zephyrproject-rtos-zephyr-v4-4-0
            version: v4.4.0
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}/.cache/west/${{ matrix.repo_slug }}/${{ matrix.ref_slug }}
      OUTPUT_DIR: ${{ github.workspace }}/out/${{ matrix.repo_slug }}-${{ matrix.ref_slug }}

    steps:
      - name: Check out zdocs
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          python -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "${GITHUB_ENV}"

      - name: Cache Zephyr workspace
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKSPACE_ROOT }}
          key: ${{ runner.os }}-west-zdocs-${{ hashFiles('scripts/build-markdown.sh', 'scripts/setup-zephyr-workspace.sh', '.github/workflows/publish-markdown-tarballs.yml') }}-${{ matrix.repo_slug }}-${{ matrix.ref_slug }}
          restore-keys: |
            ${{ runner.os }}-west-zdocs-${{ hashFiles('scripts/build-markdown.sh', 'scripts/setup-zephyr-workspace.sh', '.github/workflows/publish-markdown-tarballs.yml') }}-${{ matrix.repo_slug }}-

      - name: Install host dependencies
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            doxygen \
            graphviz \
            librsvg2-bin \
            imagemagick

      - name: Install Python tooling
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: python -m pip install --upgrade pip wheel "west>=1,<2"

      - name: Prepare Zephyr workspace
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          scripts/setup-zephyr-workspace.sh \
            --workspace-root "${WORKSPACE_ROOT}" \
            --zephyr-repo "${{ matrix.repo }}" \
            --zephyr-ref "${{ matrix.ref }}" \
            --mode filtered \
            --group-filter "-babblesim,-optional,-testing"

      - name: Set archive name
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        id: set-archive-name
        run: |
          if [[ "${{ matrix.version }}" == "main" ]]; then
            sha="$(git -C "${WORKSPACE_ROOT}/zephyr" rev-parse --short HEAD)"
            artifact_name="zephyrdocs-main-${sha}"
          else
            artifact_name="zephyrdocs-${{ matrix.version }}"
          fi
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${artifact_name}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Hash Zephyr doc requirements
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        id: requirements-hash
        run: |
          requirements_hash="$(sha256sum "${WORKSPACE_ROOT}/zephyr/doc/requirements.txt" | awk '{print $1}')"
          echo "value=${requirements_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore Python package cache
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        id: restore-python-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-zdocs-${{ matrix.target_slug }}-${{ steps.requirements-hash.outputs.value }}
          restore-keys: |
            ${{ runner.os }}-pip-zdocs-${{ matrix.target_slug }}-

      - name: Log Python environment
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          python --version
          python -m pip --version
          west --version
          {
            echo "## Tooling"
            echo ""
            echo "- target: ${{ matrix.target_slug }}"
            echo "- python: $(python --version 2>&1)"
            echo "- pip: $(python -m pip --version)"
            echo "- west: $(west --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install west package requirements
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          cd "${WORKSPACE_ROOT}"
          if ! west help packages 2>&1 | grep -q "unknown command"; then
            west packages pip --install
          else
            # west packages was introduced in Zephyr v4.0; fall back for older releases
            pip install -r zephyr/scripts/requirements-base.txt
          fi

      - name: Install Zephyr doc requirements
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          cd "${WORKSPACE_ROOT}"
          python -m pip install -r zephyr/doc/requirements.txt

      - name: Install sphinx-llm
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: python -m pip install sphinx-llm

      - name: Log resolved doc tool versions
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          python -m pip show west Sphinx sphinx-llm docutils | sed '/^$/d'

      - name: Save Python package cache
        if: ${{ (inputs.target == 'all' || inputs.target == matrix.target_slug) && steps.restore-python-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-zdocs-${{ matrix.target_slug }}-${{ steps.requirements-hash.outputs.value }}

      - name: Build markdown tarball
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          scripts/build-markdown.sh \
            --zephyr-root "${WORKSPACE_ROOT}/zephyr" \
            --output-dir "${OUTPUT_DIR}" \
            --archive-name "${{ steps.set-archive-name.outputs.archive_name }}"

      - name: Record artifact digest
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        run: |
          checksum="$(sha256sum "${OUTPUT_DIR}/${{ steps.set-archive-name.outputs.archive_name }}")"
          {
            echo "## Markdown tarball"
            echo ""
            echo "- source repo: ${{ matrix.repo }}"
            echo "- source ref: ${{ matrix.ref }}"
            echo "- artifact: ${{ steps.set-archive-name.outputs.archive_name }}"
            echo "- sha256: ${checksum%% *}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload markdown tarball
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-archive-name.outputs.artifact_name }}
          path: ${{ env.OUTPUT_DIR }}/${{ steps.set-archive-name.outputs.archive_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target_slug }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.repo_slug }}-${{ matrix.ref_slug }}"
          TITLE="Zephyr docs: ${{ matrix.repo_slug }} @ ${{ matrix.ref }}"
          NOTES="LLM-optimised Zephyr documentation markdown tarball built from \`${{ matrix.repo }}\` at ref \`${{ matrix.ref }}\`."

          ARCHIVE="${OUTPUT_DIR}/${{ steps.set-archive-name.outputs.archive_name }}"

          # Create or update the release (idempotent)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${ARCHIVE}" --clobber
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              "${ARCHIVE}"
          fi
